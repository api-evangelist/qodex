- breaking: false
  highlights:
  - A PR review page in the app, Autopilot agents and tasks, and new controls for security testing, findings, and runs.
  - PR review page. Code > PR review brings an overview (PRs reviewed, findings posted, acted on, dismissed, time to first review), the pull request
    list, and review settings together, scoped by repository and month.
  - Review records. Each pull request has a record with its summary, findings, review history with skip reasons, Q&A, and a Run review / Review
    again button.
  - Automatic reviews toggle. Automatic reviews can be turned off per repository.
  date: '2026-09-17'
- breaking: false
  highlights:
  - PR review commands and learned review context become clearer from GitHub.
  - Command acknowledgements. Qodex now acknowledges supported PR commands and replies when a command needs user attention.
  - Bare mention help. A simple @qodex‑ai mention can show the current command help in the PR thread.
  - Learned PR context. PR review can use project‑specific lessons from earlier resolved findings and reviewer feedback, and explains when no
    learned context exists yet.
  date: '2026-08-14'
- breaking: false
  highlights:
  - Sign‑in and auth‑profile setup get easier for teams using multiple identities.
  - Google and GitHub sign‑in. Users can sign in with Google, GitHub, or email.
  - Auth‑profile token check. API auth profiles can mint and test a token from the profile card before a scenario or Playground request depends
    on it.
  - Clearer token parameters. Token request settings are easier to fill out when a profile needs specific OAuth or login parameters.
  date: '2026-08-11'
- breaking: false
  highlights:
  - PR review supports monorepos and gives teams more control over which branches are reviewed.
  - Repo folder scoping. The same GitHub repo can be linked once per project directory, so monorepos can keep separate Qodex projects for separate
    apps or services.
  - Base‑branch controls. Teams can choose which base branches should receive Qodex reviews.
  - Affected route context. PR review can show which application routes are affected by a change, helping teams understand review scope.
  date: '2026-08-05'
- breaking: false
  highlights:
  - Knowledge becomes easier to browse, import, read, and edit inside Qodex.
  - Knowledge browser. The Knowledge tab now has a folder‑style browser for project notes and memory files.
  - Document import. Users can import documents into project knowledge so Qodex can use them as testing context.
  - Read and edit knowledge files. Knowledge files can be inspected and updated without leaving the Knowledge tab.
  date: '2026-07-19'
- breaking: false
  highlights:
  - Test run results become easier to share and easier to triage.
  - Plain‑English failure summaries. Failed runs can explain the likely reason for the failure before users dig into step artifacts.
  - Downloadable HTML reports. Test run details can export a self‑contained report for sharing with teammates or release owners.
  - Direct report links. Report emails can take users straight to the downloadable result.
  date: '2026-07-17'
- breaking: false
  highlights:
