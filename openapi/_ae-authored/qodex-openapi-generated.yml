components:
  schemas:
    PostApiCartPromoRequest:
      type: object
      properties:
        code:
          type: string
          description: Promo code (e.g., SPRING20)
      required:
      - code
    PostApiOrdersRequest:
      type: object
      properties:
        sku:
          type: string
          description: Product SKU, e.g., "PRO_77"
        qty:
          type: integer
          description: Quantity, e.g., 1
      required:
      - sku
      - qty
    PostApiOrdersResponse:
      type: object
      properties:
        id:
          type: string
          description: Order identifier, e.g., "ord_8f21"
        status:
          type: string
          description: Order status, e.g., "pending"
    PostApiProjectsAcmeStagingWebhooksTriggerRequest:
      type: object
      properties:
        environment:
          type: string
        tags:
          type: array
          items:
            type: string
        callback_url:
          type: string
    PostApiProjectsMyProjectSlugWebhooksTriggerRequest:
      type: object
      properties:
        environment:
          type: string
        tags:
          type: array
          items:
            type: string
        callback_url:
          type: string
    PostApiProjectsMyProjectSlugWebhooksTriggerResponse:
      type: object
      properties:
        testRunId:
          type: string
        status:
          type: string
        scenariosTotal:
          type: integer
        mode:
          type: string
    PostApiRefundsRequest:
      type: object
      properties:
        orderId:
          type: string
    PatchApiUsersMeRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
    PostAuthLoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
    PostAuthLoginResponse:
      type: object
      properties:
        status:
          type: integer
          description: Expected HTTP status code 401
        body.error:
          type: string
          description: Error field must exist
    PostCheckoutRequest:
      type: object
      properties:
        promo:
          type: string
          description: Promo code applied, e.g., SPRING20
    PostCheckoutResponse:
      type: object
      properties:
        total:
          type: number
          description: Calculated total after applying promo
        error:
          type: string
          description: 'Error message if calculation fails (e.g., TypeError: total is undefined)'
    GetPetsPetidResponse:
      type: object
      properties:
        '200':
          type: string
          description: One pet
    PostUsersRequest:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
      required:
      - email
      - name
    PostUsersResponse:
      type: object
      properties:
        id:
          type: string
    PostV1AuthRefreshResponse:
      type: object
      properties:
        session_token:
          type: string
          description: New rotated session token
    GetV1CartResponse:
      type: object
      properties:
        items:
          type: array
          description: List of cart items (example shows 2 items)
    PostV1OrdersRequest:
      type: object
      properties:
        sku:
          type: string
        qty:
          type: integer
    PostV1OrdersResponse:
      type: object
      properties:
        Authorization:
          type: string
        Content-Type:
          type: string
    PostV1PaymentsRequest:
      type: object
      properties:
        card:
          type: string
          description: Card number, e.g., 4000…0069
        expiry:
          type: string
          description: Expiry date, e.g., 04/22
        cvc:
          type: string
          description: CVC code, e.g., 123
      required:
      - card
      - expiry
      - cvc
    PostV1PaymentsResponse:
      type: object
      properties:
        error:
          type: string
          description: Error identifier, e.g., "card_expired"
        decline_code:
          type: string
          description: Decline reason code, e.g., "expired_card"
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
